<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BluePixel — motion studio demo film</title>
<style>
  @font-face { font-family: 'Barlow SC'; src: url(assets/fonts/BarlowSemiCondensed-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: 'Barlow SC'; src: url(assets/fonts/BarlowSemiCondensed-Bold.ttf); font-weight: 700; }
  @font-face { font-family: 'Barlow SC'; src: url(assets/fonts/BarlowSemiCondensed-ExtraBold.ttf); font-weight: 800; }
  @font-face { font-family: 'Inter'; src: url(assets/fonts/Inter.ttf); font-weight: 100 900; }
  html, body { margin: 0; background: #111; height: 100%; display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// BluePixel demo film — 12s, 120 BPM. A pure function of time: window.seek(t).
// Story: scattered data → Connect / Enrich / Predict / Deliver → "Buy it. Then fill it." → logo.
// Every scene is laid out in units of `u` (shorter side / 1080) so 9x16, 1x1 and 16x9 all work.
// ─────────────────────────────────────────────────────────────────────────────
import { clamp, lerp, spring, sp, track, swapAlpha, win, rng, SNAPPY, DEFAULT, HEAVY, PLAYFUL } from './lib/motion.js';

const q = new URLSearchParams(location.search);
const SIZES = { '9x16': [1080, 1920], '1x1': [1080, 1080], '16x9': [1920, 1080], '4x5': [1080, 1350] };
const [BW, BH] = SIZES[q.get('format') || '9x16'];
const SCALE = Number(q.get('scale') || 1);
const W = Math.round(BW * SCALE / 2) * 2, H = Math.round(BH * SCALE / 2) * 2;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const u = Math.min(W, H) / 1080;              // layout unit
const CX = W / 2, CY = H / 2;
const TALL = H / W > 1.3, WIDE = W / H > 1.3, SQUARE = !TALL && !WIDE;

window.FILM = { dur: 12, bpm: 120, title: 'BluePixel — demo film' };
const B = 60 / window.FILM.bpm;                // 0.5s per beat

// ── Brand tokens (BluePixel design system) ──────────────────────────────────
const C = {
  paper: '#FAF7F2', dot: 'rgba(14,165,233,0.25)', navy: '#1A1A2E', navyA: '#0F1629', navyB: '#121E2B',
  blue: '#0EA5E9', green: '#5DAE50', amberA: '#F59E0B', amberB: '#B86E00', ink: '#1A1A2E',
  muted: '#7A7F8A', tile: '#E9E4DA', tileLine: '#DCD5C8', white: '#FFFFFF',
};
const DISPLAY = (w, px) => `${w} ${px}px "Barlow SC"`;
const UI = (w, px) => `${w} ${px}px "Inter"`;

// ── Drawing helpers ─────────────────────────────────────────────────────────
function paper() {
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  const step = 28 * u; g.fillStyle = C.dot;
  for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step) {
    g.beginPath(); g.arc(x, y, 1.4 * u, 0, Math.PI * 2); g.fill();
  }
}
function navyFill() {
  const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, C.navyA); gr.addColorStop(1, C.navyB);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function brandGradient(x0, y0, x1, y1) {
  const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, C.blue); gr.addColorStop(1, C.green); return gr;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(str, x, y, font, color, align = 'center', tracking = 0) {
  g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic';
  g.letterSpacing = `${tracking}px`; g.fillText(str, x, y); g.letterSpacing = '0px';
}
function gradText(str, x, y, font, align = 'center', tracking = 0) {
  g.font = font; g.letterSpacing = `${tracking}px`;
  const w = g.measureText(str).width, x0 = align === 'center' ? x - w / 2 : x;
  text(str, x, y, font, brandGradient(x0, y - 100 * u, x0 + w, y), align, tracking);
}
// Largest display size (<= maxPx) at which `str` fits in maxW.
function fit(str, weight, maxPx, maxW, tracking = 0) {
  g.font = DISPLAY(weight, 100); g.letterSpacing = `${tracking}px`;
  const w = g.measureText(str).width; g.letterSpacing = '0px';
  return Math.min(maxPx, (100 * maxW) / w);
}
function shadowed(fn, blur = 30, oy = 12, a = 0.12) {
  g.save(); g.shadowColor = `rgba(26,26,46,${a})`; g.shadowBlur = blur * u; g.shadowOffsetY = oy * u; fn(); g.restore();
}
// Clip-reveal a line of type from below: p 0→1
function riseText(str, x, y, font, color, p, align = 'center', tracking = 0, gradient = false) {
  if (p <= 0) return;
  g.save(); g.font = font;
  const m = g.measureText('Hg'), asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  g.beginPath(); g.rect(0, y - asc - 6 * u, W, asc + desc + 12 * u); g.clip();
  const off = (1 - p) * (asc + desc + 12 * u);
  gradient ? gradText(str, x, y + off, font, align, tracking) : text(str, x, y + off, font, color, align, tracking);
  g.restore();
}

// ── Scene 1 (0–2s): hook — "Your deal data is scattered." + source chips ────
const CHIPS = ['LoopNet', 'Crexi', 'County records', 'Zoning', 'Your CRM', 'Spreadsheets', 'Tax history', 'Comps'];
function chipLayout(i) {
  const r = rng(101 + i * 17);
  const cols = TALL ? 2 : WIDE ? 4 : 3, row = Math.floor(i / cols), col = i % cols;
  const spanX = TALL ? 860 * u : WIDE ? Math.min(W * 0.85, 1600 * u) : 980 * u, spanY = TALL ? 1000 * u : WIDE ? 340 * u : 380 * u;
  const rows = Math.ceil(CHIPS.length / cols);
  return {
    x: CX - spanX / 2 + (col + 0.5) * (spanX / cols) + (r() - 0.5) * 80 * u,
    y: (TALL ? CY + 250 * u : CY + 230 * u) - spanY / 2 + (row + 0.5) * (spanY / rows) + (r() - 0.5) * 50 * u,
    rot: (r() - 0.5) * 0.22,
  };
}
function drawChip(label, x, y, rot, s, alpha, lit = 0) {
  if (s <= 0.001 || alpha <= 0) return;
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.globalAlpha = alpha;
  g.font = UI(600, 50 * u); const w = g.measureText(label).width + 84 * u, h = 108 * u;
  shadowed(() => { rr(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = C.white; g.fill(); }, 28, 10, 0.14);
  rr(-w / 2, -h / 2, w, h, h / 2); g.lineWidth = 2 * u; g.strokeStyle = lit > 0 ? C.blue : C.tileLine; g.stroke();
  g.beginPath(); g.arc(-w / 2 + 42 * u, 0, 11 * u, 0, Math.PI * 2); g.fillStyle = lit > 0 ? C.blue : '#C9C2B4'; g.fill();
  text(label, 14 * u, 17 * u, UI(600, 50 * u), C.ink, 'center');
  g.restore();
}
function scene1(t) {
  const ty = TALL ? CY - 470 * u : CY - 230 * u, lx = TALL ? 110 * u : CX;
  const align = TALL ? 'left' : 'center';
  const fs = fit('YOUR DEAL DATA', 800, 170 * u, TALL ? W - 220 * u : W * 0.8, -2 * u);
  const out = clamp((t - 1.75) / 0.2);                     // lines leave before the first box word lands
  g.save(); g.globalAlpha = 1 - out; g.translate(0, -out * 80 * u);
  riseText('YOUR DEAL DATA', lx, ty, DISPLAY(800, fs), C.ink, sp(t + 0.12, SNAPPY), align, -2 * u);
  riseText('IS SCATTERED.', lx, ty + fs * 0.98, DISPLAY(800, fs), C.blue, sp(t - B + 0.1, SNAPPY), align, -2 * u);
  g.restore();
  // chips pop on eighth notes from 1.0s
  CHIPS.forEach((c, i) => {
    const t0 = 1.5 * B + i * (B / 2) * 0.55, L = chipLayout(i);
    const s = sp(t - t0, PLAYFUL);
    drawChip(c, L.x, L.y, L.rot + (1 - s) * 0.4, s, 1 - out);
  });
}

// ── Scene 2 (1.9–4.25s): grey tile wall, "Scattered. Stale. Slow.", lights up ─
const TILE_COLS = TALL ? 4 : 8;
function scene2(t) {
  const lt = t - 1.9;
  if (lt < 0) return;
  const tw = (W - 80 * u) / TILE_COLS, th = tw * 0.62, gap = 18 * u;
  const scroll = lt * 160 * u + (1 - sp(lt, DEFAULT)) * 400 * u;
  const wallIn = sp(lt, DEFAULT);
  const r = rng(7);
  const rows = Math.ceil(H / (th + gap)) + 4;
  g.save(); g.globalAlpha = clamp(lt / 0.2);
  for (let row = 0; row < rows; row++) for (let col = 0; col < TILE_COLS; col++) {
    const seed = r(), seed2 = r();
    const x = 40 * u + col * tw + gap / 2;
    const y = row * (th + gap) - scroll + (col % 2) * th * 0.5 + (1 - wallIn) * (300 + seed * 300) * u;
    if (y < -th || y > H + th) continue;
    // light-up wave from the centre at 3.5s
    const d = Math.hypot(x + tw / 2 - CX, y + th / 2 - CY) / Math.max(W, H);
    const lit = sp(t - 3.5 - d * 0.5, SNAPPY);
    const pulse = seed2 > 0.85 ? win(lt, 0.3 + seed * 1.2, 0.8 + seed * 1.2, 0.08, 0.3) : 0;
    rr(x, y, tw - gap, th, 18 * u);
    g.fillStyle = lit > 0.5 ? C.blue : (pulse > 0 ? '#BFE6F8' : C.tile); g.fill();
    // little listing skeleton: pin + two lines
    const ink = lit > 0.5 ? 'rgba(255,255,255,0.85)' : 'rgba(26,26,46,0.16)';
    g.fillStyle = ink;
    g.beginPath(); g.arc(x + 34 * u, y + 40 * u, 12 * u, 0, Math.PI * 2); g.fill();
    rr(x + 60 * u, y + 32 * u, (tw - gap) * (0.35 + seed * 0.3), 16 * u, 8 * u); g.fill();
    rr(x + 24 * u, y + th - 46 * u, (tw - gap) * 0.55, 14 * u, 7 * u); g.fill();
    if (lit > 0.01 && lit < 0.99) { // flip flash
      g.globalAlpha = 1 - Math.abs(lit - 0.5) * 2; rr(x, y, tw - gap, th, 18 * u); g.fillStyle = '#fff'; g.fill(); g.globalAlpha = 1;
    }
  }
  g.restore();
  // kinetic words on beats 2.0 / 2.5 / 3.0, each replaces the last
  const words = [['STALE.', 2.0], ['SILOED.', 2.5], ['SLOW.', 3.0]];
  words.forEach(([w, t0], i) => {
    const end = i < 2 ? words[i + 1][1] : 3.5;
    const a = win(t, t0 - 0.05, end - 0.02, 0.05, 0.05);
    if (a <= 0) return;
    const s = 0.86 + 0.14 * sp(t - t0 + 0.05, SNAPPY);
    g.save(); g.translate(CX, CY); g.scale(s, s); g.globalAlpha = a;
    const fs2 = fit('SILOED.', 800, 230 * u, W - 260 * u, -3 * u);
    g.font = DISPLAY(800, fs2); g.letterSpacing = `${-3 * u}px`;
    const tw2 = g.measureText(w).width + 90 * u; g.letterSpacing = '0px';
    shadowed(() => { rr(-tw2 / 2, -fs2 * 0.66, tw2, fs2 * 0.92, 26 * u); g.fillStyle = C.navy; g.fill(); }, 40, 16, 0.25);
    text(w, 0, fs2 * 0.13, DISPLAY(800, fs2), C.paper, 'center', -3 * u);
    g.restore();
  });
}

// ── Scene 3 (3.75–8.2s): navy — the 4-step ring ─────────────────────────────
const STEPS = [
  ['CONNECT', 'Listings, records and your CRM in one property graph.'],
  ['ENRICH', 'Comps, demographics and ownership, filled in.'],
  ['PREDICT', 'Deal grade, DSCR and risk flags, scored.'],
  ['DELIVER', 'Dashboards, AI answers and shareable links.'],
];
const STEP_T = [4.0, 5.0, 6.0, 7.0];
function navyMask(t) {
  // grows as a circle from the centre (3.75–4.25), leaves upward (7.75–8.25)
  const grow = sp(t - 3.75, [140, 24]);
  const leave = sp(t - 7.75, [140, 24]);
  return { r: grow * Math.hypot(W, H) * 0.6, y: -leave * H * 1.05 };
}
function scene3(t) {
  if (t < 3.75 || t > 8.6) return;
  const m = navyMask(t);
  g.save();
  g.translate(0, m.y);
  g.beginPath(); g.arc(CX, CY, Math.max(0.01, m.r), 0, Math.PI * 2); g.clip();
  navyFill();
  // subtle pixel grid on navy
  g.fillStyle = 'rgba(14,165,233,0.10)';
  const st = 28 * u; for (let y = st / 2; y < H; y += st) for (let x = st / 2; x < W; x += st) g.fillRect(x - u, y - u, 2 * u, 2 * u);

  const ringY = TALL ? CY - 170 * u : WIDE ? CY - 40 * u : CY - 140 * u, ringX = WIDE ? CX - 360 * u : CX, R = TALL ? 360 * u : WIDE ? 300 * u : 230 * u;
  const prog = track(t, [[0, 0], [STEP_T[0], 0.25], [STEP_T[1], 0.5], [STEP_T[2], 0.75], [STEP_T[3], 1]], 120, 22);
  const ringIn = sp(t - 3.95, DEFAULT);
  // track
  g.lineCap = 'round';
  g.beginPath(); g.arc(ringX, ringY, R * (0.8 + 0.2 * ringIn), 0, Math.PI * 2);
  g.lineWidth = 34 * u; g.strokeStyle = `rgba(255,255,255,${0.08 * ringIn})`; g.stroke();
  // progress arc
  if (prog > 0.002) {
    g.beginPath(); g.arc(ringX, ringY, R, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
    g.lineWidth = 34 * u; g.strokeStyle = brandGradient(ringX - R, ringY - R, ringX + R, ringY + R); g.stroke();
  }
  // quarter nodes pop as each step lands
  STEP_T.forEach((t0, i) => {
    const a = -Math.PI / 2 + (i + 1) * Math.PI / 2, s = sp(t - t0 - 0.12, PLAYFUL);
    if (s <= 0) return;
    g.beginPath(); g.arc(ringX + Math.cos(a) * R, ringY + Math.sin(a) * R, 22 * u * s, 0, Math.PI * 2);
    g.fillStyle = C.white; g.fill();
  });
  // numeral + word inside the ring, swap on each step
  STEPS.forEach(([word, line], i) => {
    const tIn = STEP_T[i], tOut = i < 3 ? STEP_T[i + 1] : 8.2;
    const a = swapAlpha(t, tIn - 0.1, tOut + 0.05);
    if (a <= 0) return;
    const rise = (1 - sp(t - tIn, SNAPPY)) * 40 * u;
    g.save(); g.globalAlpha = a;
    g.font = DISPLAY(800, (SQUARE ? 200 : 290) * u); g.lineWidth = 3 * u; g.strokeStyle = 'rgba(255,255,255,0.35)'; g.textAlign = 'center';
    g.strokeText(String(i + 1).padStart(2, '0'), ringX, ringY + (SQUARE ? 20 : 30) * u + rise);
    text(word, ringX, ringY + (SQUARE ? 105 : 150) * u + rise, DISPLAY(800, (SQUARE ? 72 : 104) * u), C.white, 'center', 6 * u);
    // descriptor below the ring (or to the right on wide formats)
    const dx = WIDE ? CX + 120 * u : CX, dy = TALL ? ringY + R + 190 * u : WIDE ? CY - 20 * u : ringY + R + 120 * u;
    const dfs = SQUARE ? 46 : 58;
    const lines = wrap(line, UI(500, dfs * u), TALL ? 860 * u : WIDE ? 760 * u : 900 * u);
    lines.forEach((ln, k) => text(ln, dx, dy + k * dfs * 1.35 * u + rise * 0.6, UI(500, dfs * u), 'rgba(255,255,255,0.82)', WIDE ? 'left' : 'center'));
    g.restore();
  });
  // step dots row
  const dotsY = TALL ? ringY + R + 420 * u : WIDE ? CY + 200 * u : ringY + R + 290 * u, dotsX = WIDE ? CX + 120 * u + 90 * u : CX;
  STEPS.forEach((_, i) => {
    const on = sp(t - STEP_T[i], SNAPPY);
    const x = dotsX + (i - 1.5) * 60 * u - (TALL ? 0 : 0);
    rr(x - (14 + 22 * on) * u / 2 * 1, dotsY - 7 * u, (14 + 22 * on) * u, 14 * u, 7 * u);
    g.fillStyle = on > 0.5 ? C.blue : 'rgba(255,255,255,0.25)'; g.fill();
  });
  g.restore();
}
function wrap(str, font, maxW) {
  g.font = font; const words = str.split(' '), out = []; let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (g.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test; }
  if (line) out.push(line); return out;
}

// ── Scene 4 (8.0–10.3s): "Buy it. Then fill it." ────────────────────────────
function scene4(t) {
  if (t < 7.9 || t > 10.4) return;
  const out = clamp(sp(t - 10.0, SNAPPY));
  const fs = fit('THEN FILL IT.', 800, 240 * u, W - 160 * u, -3 * u);
  const y0 = CY - fs * 0.25;
  g.save(); g.globalAlpha = 1 - out; g.translate(CX, 0); g.scale(1 - out * 0.08, 1 - out * 0.08); g.translate(-CX, 0);
  riseText('BUY IT.', CX, y0, DISPLAY(800, fs), C.ink, sp(t - 7.92, HEAVY), 'center', -3 * u);
  riseText('THEN FILL IT.', CX, y0 + fs * 0.95, DISPLAY(800, fs), null, sp(t - 9.0, HEAVY), 'center', -3 * u, true);
  // underline sweep left→right in the brand gradient
  const ul = sp(t - 9.15, DEFAULT);
  g.font = DISPLAY(800, fs); g.letterSpacing = `${-3 * u}px`;
  const w = g.measureText('THEN FILL IT.').width; g.letterSpacing = '0px';
  if (ul > 0) { rr(CX - w / 2, y0 + fs * 1.12, w * ul, 18 * u, 9 * u); g.fillStyle = brandGradient(CX - w / 2, 0, CX + w / 2, 0); g.fill(); }
  g.restore();
}

// ── Scene 5 (10.0–12s): pixel "B" mark assembles, wordmark, CTA ─────────────
const MARK = ['XXXX.', 'X...X', 'X...X', 'XXXXb', 'X...X', 'X...X', 'XXXX.'];
function scene5(t) {
  if (t < 10.0) return;
  const lt = t - 10.0;
  const px = 38 * u, gap = 6 * u, mw = 5 * (px + gap), mh = 7 * (px + gap);
  const mx = CX - mw / 2, my = (TALL ? CY - 420 * u : CY - 330 * u);
  const r = rng(42);
  let n = 0;
  MARK.forEach((row, ry) => [...row].forEach((ch, rx) => {
    if (ch === '.') return;
    const sx = (r() - 0.5) * W * 1.1, sy = (r() - 0.5) * H * 0.9, delay = r() * 0.25 + n++ * 0.012;
    const p = sp(lt - delay, [200, 24]);
    const x = lerp(CX + sx, mx + rx * (px + gap), p), y = lerp(CY + sy, my + ry * (px + gap), p);
    g.globalAlpha = clamp(p * 3);
    g.fillStyle = ch === 'b' ? C.blue : C.navy;
    rr(x, y, px, px, 4 * u); g.fill();
  }));
  g.globalAlpha = 1;
  const wy = my + mh + 150 * u;
  // wordmark letters stagger in
  const word = 'BLUE PIXEL';
  g.font = DISPLAY(800, 128 * u); g.letterSpacing = `${8 * u}px`;
  const ww = g.measureText(word).width; g.letterSpacing = '0px';
  let x = CX - ww / 2;
  [...word].forEach((ch, i) => {
    g.font = DISPLAY(800, 128 * u); g.letterSpacing = `${8 * u}px`;
    const cw = g.measureText(ch).width; g.letterSpacing = '0px';
    const p = sp(lt - 0.45 - i * 0.03, SNAPPY);
    riseText(ch, x, wy, DISPLAY(800, 128 * u), C.navy, p, 'left', 8 * u);
    x += cw;
  });
  riseText('PROPERTY INTELLIGENCE LAYER', CX, wy + 72 * u, UI(600, 34 * u), C.muted, sp(lt - 0.8, SNAPPY), 'center', 7 * u);
  // CTA pill — the only amber on screen
  const cp = sp(lt - 1.1, PLAYFUL);
  if (cp > 0) {
    g.save(); g.translate(CX, wy + 260 * u); g.scale(cp, cp);
    g.font = UI(700, 54 * u); const label = 'Start free  ·  bluepxl.com'; const w = g.measureText(label).width + 120 * u, h = 132 * u;
    const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0); gr.addColorStop(0, C.amberA); gr.addColorStop(1, C.amberB);
    shadowed(() => { rr(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = gr; g.fill(); }, 30, 12, 0.22);
    text(label, 0, 19 * u, UI(700, 54 * u), C.white, 'center');
    g.restore();
  }
}

// ── Compose ─────────────────────────────────────────────────────────────────
function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  paper();
  if (t < 2.4) scene1(t);
  if (t >= 1.9 && t < 4.6) scene2(t);
  scene3(t);
  scene4(t);
  scene5(t);
}
window.seek = (t) => { draw(t); return true; };

// Fonts must be loaded before the first frame or canvas falls back silently.
window.ready = Promise.all([
  document.fonts.load(DISPLAY(800, 100)), document.fonts.load(DISPLAY(700, 100)), document.fonts.load(DISPLAY(600, 100)),
  document.fonts.load(UI(500, 40)), document.fonts.load(UI(600, 40)), document.fonts.load(UI(700, 40)),
]);

// Live preview in a normal browser (off during headless render). Space = pause, ←/→ = scrub.
if (!q.get('render')) {
  await window.ready;
  let t0 = performance.now(), paused = false, held = 0;
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { paused = !paused; if (!paused) t0 = performance.now() - held * 1000; }
    if (e.code === 'ArrowRight') { held = Math.min(window.FILM.dur, held + 0.1); t0 = performance.now() - held * 1000; }
    if (e.code === 'ArrowLeft') { held = Math.max(0, held - 0.1); t0 = performance.now() - held * 1000; }
  });
  (function loop() {
    if (!paused) held = ((performance.now() - t0) / 1000) % window.FILM.dur;
    draw(held); requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
